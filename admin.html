<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Dulce Suerte MELORA</title>
<style>
:root{--bg:#fff5f8;--card:#fff;--ink:#4a2a3a;--mute:#8a6677;--pink:#e84a8a;--gold:#b98a2c;--free:#ffe3ee;--line:#f3c9d8;--sold:#cfc4ca;--res:#ffe28a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1d1217;--card:#2a1a22;--ink:#fbe9f0;--mute:#c9a6b6;--pink:#ff6fa6;--gold:#e0b85a;--free:#43212f;--line:#5a2f42;--sold:#4a3d44;--res:#6b5718;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 90px}
h1{font:bold 24px Georgia,serif;color:var(--pink);margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
input{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px}
button{cursor:pointer;font:bold 15px system-ui,sans-serif}
.b{width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;background:var(--pink);color:#fff}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
.n{padding:12px 0;border-radius:11px;border:1.5px solid var(--line);background:var(--free);color:var(--ink)}
.n.r{background:var(--res);border-color:var(--gold)}.n.s{background:var(--sold);text-decoration:line-through;border-color:transparent}
.sum{display:flex;gap:8px;text-align:center}.sum div{flex:1;background:var(--free);border-radius:12px;padding:8px 4px;font-size:12px;color:var(--mute)}.sum b{display:block;font-size:20px;color:var(--ink)}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
#bar .b{margin:0;flex:1}#msg{font-size:13px;flex:1.2;color:var(--mute)}
.small{font-size:12px;color:var(--mute)}a{color:var(--pink)}
</style></head><body><main>
<h1>Panel Dulce Suerte 🎀</h1>
<div class="small">Toca un número para cambiarlo: <b>libre → apartado → vendido → libre</b>. Luego pulsa Guardar.</div>

<div class="card" id="cfg">
  <b>Conexión con GitHub</b> <span class="small">(se guarda solo en este dispositivo)</span>
  <label>Usuario de GitHub</label><input id="o" value="catalogomelora" autocapitalize="off">
  <label>Repositorio</label><input id="r" value="sorteomelora" autocapitalize="off">
  <label>Token de acceso</label><input id="t" type="password" placeholder="github_pat_..." autocapitalize="off">
  <button class="b" id="conn">Conectar</button>
</div>

<div id="panel" hidden>
  <div class="sum"><div><b id="cl">0</b>Libres</div><div><b id="cr">0</b>Apartados</div><div><b id="cs">0</b>Vendidos</div><div><b id="cm">$0</b>Recaudado</div></div>
  <div id="grid"></div>
  <button class="b" id="out" style="background:transparent;color:var(--mute);font-weight:normal">Desconectar este dispositivo</button>
</div>

<div id="bar" hidden><div id="msg"></div><button class="b" id="save">Guardar cambios</button></div>

<script>
var S={r:[],s:[]},SHA=null,dirty=false,$=function(i){return document.getElementById(i)};
var P="estado.json";
function cfg(){return{o:$("o").value.trim(),r:$("r").value.trim(),t:$("t").value.trim()}}
function api(){var c=cfg();return "https://api.github.com/repos/"+c.o+"/"+c.r+"/contents/"+P}
function hd(){return{Authorization:"Bearer "+cfg().t,Accept:"application/vnd.github+json"}}
function say(t){$("msg").textContent=t}
function pad(i){return(i<10?"0":"")+i}
function st(n){return S.s.indexOf(n)>-1?"s":S.r.indexOf(n)>-1?"r":"a"}
function render(){
  var g=$("grid");g.innerHTML="";
  for(var i=0;i<100;i++){var n=pad(i),b=document.createElement("button");b.className="n "+st(n);b.textContent=n;
    b.onclick=(function(n){return function(){
      var k=st(n);S.r=S.r.filter(function(x){return x!==n});S.s=S.s.filter(function(x){return x!==n});
      if(k==="a")S.r.push(n);else if(k==="r")S.s.push(n);
      dirty=true;say("Cambios sin guardar");render()}})(n);g.appendChild(b)}
  $("cr").textContent=S.r.length;$("cs").textContent=S.s.length;$("cl").textContent=100-S.r.length-S.s.length;
  $("cm").textContent="$"+(S.s.length*5000).toLocaleString("es-CO");
}
async function load(){
  say("Cargando...");
  var res=await fetch(api()+"?t="+Date.now(),{headers:hd(),cache:"no-store"});
  if(res.status===404){S={r:[],s:[]};SHA=null}
  else if(!res.ok){throw new Error(res.status===401?"Token inválido o vencido":"No se pudo conectar ("+res.status+")")}
  else{var j=await res.json();SHA=j.sha;var d=JSON.parse(atob(j.content.replace(/\n/g,"")));S={r:d.r||[],s:d.s||[]}}
  dirty=false;render();say("Conectado ✔");
}
async function connect(){
  var c=cfg();if(!c.o||!c.r||!c.t){alert("Completa los tres campos.");return}
  try{await load();
    try{localStorage.setItem("melora_cfg",JSON.stringify(c))}catch(e){}
    $("cfg").hidden=true;$("panel").hidden=false;$("bar").hidden=false;
  }catch(e){alert(e.message)}
}
async function save(){
  say("Guardando...");
  var body={message:"Actualizar números",content:btoa(JSON.stringify({r:S.r.sort(),s:S.s.sort()})),branch:"main"};
  if(SHA)body.sha=SHA;
  var res=await fetch(api(),{method:"PUT",headers:hd(),body:JSON.stringify(body)});
  if(res.ok){var j=await res.json();SHA=j.content.sha;dirty=false;say("Guardado ✔ Se verá en la página en ~1 minuto")}
  else if(res.status===409||res.status===422){say("Alguien más guardó antes. Recargando...");await load()}
  else say("Error al guardar ("+res.status+"). Revisa el token.");
}
$("conn").onclick=connect;$("save").onclick=function(){save().catch(function(){say("Sin conexión, intenta de nuevo")})};
$("out").onclick=function(){try{localStorage.removeItem("melora_cfg")}catch(e){}location.reload()};
window.addEventListener("beforeunload",function(e){if(dirty){e.preventDefault();e.returnValue=""}});
try{var s=JSON.parse(localStorage.getItem("melora_cfg")||"null");if(s){$("o").value=s.o;$("r").value=s.r;$("t").value=s.t;connect()}}catch(e){}
</script></main></body></html>
